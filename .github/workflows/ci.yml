# Minimal guard rail for a project whose bugs are mostly silent ones.
#
# Two independent jobs, cheapest first:
#   host  -- builds the engine + every plugin for x86_64 Linux and instantiates
#            AND renders every registered model (rack_ui_smoke --all-modules).
#            This is the check that actually catches plugin regressions, and it
#            needs no Android SDK, so it fails fast.
#   android -- builds arm64-v8a and x86_64 APKs/AABs plus all 21 matching
#              .rdmod packs, proving both NDK/CMake paths end to end.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host smoke test (all modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build + Mesa dependencies
        run: |
          sudo apt-get update
          # libegl1-mesa-dev/libgles-dev: rack_ui_smoke renders through Mesa's
          # surfaceless EGL platform. xxd: Valley embeds its ROMs via `xxd -i`.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build xxd \
            libegl1-mesa-dev libgles-dev libgl1-mesa-dri

      - name: Port-layer logic tests (no device needed)
        # The thread-count decision against readings real devices gave, and
        # the engine barrier under stress. Seconds each; first, so a broken
        # decision fails before the twenty-minute build does.
        run: |
          g++ -std=c++17 -Wall native/port/thread_choice_test.cpp -o /tmp/thread_choice_test && /tmp/thread_choice_test
          g++ -O2 -pthread native/port/engine_barrier_test.cpp -o /tmp/barrier_test && /tmp/barrier_test

      - name: Build, load and render every plugin model
        # Stages every plugin manifest/resource directory, requires all 21
        # optional libraries to load, then instantiates every registered model.
        run: scripts/host_smoke.sh

  android:
    name: Release APK, AAB and packs (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default also asks for "tools", a package Google's
          # repository no longer has: sdkmanager then fails the step. Gradle
          # fetches the platform, the NDK and CMake itself.
          packages: platform-tools

      - name: Build APK, AAB and all plugin libraries
        # -PdevKeystore: the private key is deliberately not in the repo, so CI
        # signs with the public development key. Never publish this artifact.
        # The sideload APK is what people download from GitHub (it can update
        # itself); the Play bundle is the one without that permission set.
        run: >-
          ./gradlew assembleSideloadRelease bundlePlayRelease
          -PdevKeystore -PallPlugins
          -PtargetAbis=${{ matrix.abi }} --no-daemon

      - name: Package and validate all 21 expansion packs
        run: scripts/make_rdmods.sh "$RUNNER_TEMP/rdmods" "${{ matrix.abi }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rackdroid-debugkey-release-${{ matrix.abi }}
          path: |
            app/build/outputs/apk/sideload/release/app-sideload-release.apk
            app/build/outputs/bundle/playRelease/app-play-release.aab
            ${{ runner.temp }}/rdmods/*.rdmod
          if-no-files-found: error
